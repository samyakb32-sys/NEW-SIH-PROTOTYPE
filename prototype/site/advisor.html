<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Advisor — AgriConnect</title>
<meta name="description" content="AgriConnect AI Advisor — ask about mandi prices, the best time to sell, or a buyer's offer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f9; --bg-alt: #eef1f4; --card: #ffffff; --border: #e3e7ec;
    --ink: #12181f; --ink-soft: #5b6472; --ink-faint: #8b93a1;
    --green: #16a34a; --green-deep: #14532d;
    --mint-bg: #e8f8ee; --mint-ic: #0f9d58;
    --red-bg: #fdecec; --red-ic: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0f14; --bg-alt: #11151c; --card: #151a22; --border: #262c37;
      --ink: #eef1f5; --ink-soft: #a2acb9; --ink-faint: #6b7482;
      --mint-bg: #103524; --mint-ic: #34d399; --red-bg: #341313; --red-ic: #f27272;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0f14; --bg-alt: #11151c; --card: #151a22; --border: #262c37;
    --ink: #eef1f5; --ink-soft: #a2acb9; --ink-faint: #6b7482;
    --mint-bg: #103524; --mint-ic: #34d399; --red-bg: #341313; --red-ic: #f27272;
  }

  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 15.5px; line-height: 1.55; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; height: 100vh;
  }
  h1 { margin: 0; font-size: 17px; font-weight: 700; }
  a { color: inherit; }
  button { font: inherit; }
  *:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  header.top { flex: none; background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
  header.top .brand { display: flex; align-items: center; gap: 9px; text-decoration: none; }
  header.top .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--green); display: grid; place-items: center; flex: none; }
  header.top .title-wrap { display: flex; flex-direction: column; }
  header.top .subtitle { font-size: 11.5px; color: var(--ink-faint); }
  header.top .back { margin-left: auto; font-size: 13px; color: var(--ink-soft); text-decoration: none; display: flex; align-items: center; gap: 6px; }
  header.top .back:hover { color: var(--ink); }

  .chat-wrap { flex: 1; overflow-y: auto; }
  .chat-inner { max-width: 720px; margin: 0 auto; padding: 24px 20px 16px; display: flex; flex-direction: column; gap: 14px; }

  .msg { display: flex; gap: 10px; max-width: 88%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .avatar { width: 30px; height: 30px; border-radius: 8px; flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
  .msg.bot .avatar { background: var(--mint-bg); color: var(--mint-ic); }
  .msg.user .avatar { background: var(--ink); color: var(--bg); }
  .msg .bubble { padding: 11px 15px; border-radius: 14px; font-size: 14.5px; white-space: pre-wrap; }
  .msg.bot .bubble { background: var(--card); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .msg.user .bubble { background: var(--green); color: #fff; border-top-right-radius: 4px; }
  .msg.error .bubble { background: var(--red-bg); color: var(--red-ic); border: 1px solid transparent; }

  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint); animation: bounce 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }

  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 16px; max-width: 720px; margin: 0 auto; width: 100%; }
  .suggestions button {
    background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 8px 14px;
    font-size: 13px; color: var(--ink-soft); cursor: pointer;
  }
  .suggestions button:hover { border-color: var(--green); color: var(--green); }

  .composer { flex: none; border-top: 1px solid var(--border); background: var(--card); padding: 14px 20px; }
  .composer-inner { max-width: 720px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  .composer textarea {
    flex: 1; resize: none; font: inherit; font-size: 14.5px; padding: 11px 14px; border: 1px solid var(--border);
    border-radius: 12px; background: var(--bg-alt); color: var(--ink); max-height: 120px; min-height: 44px;
  }
  .composer .send-btn {
    background: var(--green); color: #fff; border: none; border-radius: 12px; width: 44px; height: 44px;
    display: grid; place-items: center; cursor: pointer; flex: none;
  }
  .composer .send-btn:hover { background: var(--green-deep); }
  .composer .send-btn:disabled { opacity: .5; cursor: not-allowed; }
  .composer .hint { font-size: 11.5px; color: var(--ink-faint); margin-top: 8px; text-align: center; }
</style>
<script src="i18n.js"></script>
</head>
<body>

<header class="top">
  <a href="dashboard.html" class="brand">
    <span class="mark"><svg width="16" height="16" viewBox="0 0 30 30" fill="none"><path d="M15 22V13M15 13C15 9 11 7 8 7C8 12 10 15 15 13Z" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 13C15 9.5 18.5 7.5 22 8C22 12 19.5 14.5 15 13Z" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="title-wrap"><h1 data-i18n="advisor_title">AI Advisor</h1><span class="subtitle" data-i18n="advisor_subtitle">AgriConnect · price &amp; sell-timing assistant</span></span>
  </a>
  <label class="lang-pick" style="display:flex; align-items:center; gap:5px; border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:13px; color:var(--ink-soft); background:var(--bg-alt); margin-left:auto;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18 14 14 0 010-18z"/></svg>
    <select id="langSelect" style="border:none; background:none; font:inherit; color:var(--ink); cursor:pointer;"></select>
  </label>
  <a href="dashboard.html" class="back" data-i18n="advisor_back">← Back to Dashboard</a>
</header>

<div class="chat-wrap" id="chatWrap">
  <div class="chat-inner" id="chatInner"></div>
</div>

<div class="suggestions" id="suggestions">
  <button type="button" data-q="Should I sell my wheat now or wait?" data-i18n="advisor_suggestion_1">Should I sell my wheat now or wait?</button>
  <button type="button" data-q="How do I know if a buyer's offer is fair?" data-i18n="advisor_suggestion_2">Is this buyer's offer fair?</button>
  <button type="button" data-q="Which nearby mandi gives the best net price after transport?" data-i18n="advisor_suggestion_3">Best mandi after transport cost?</button>
</div>

<div class="composer">
  <div class="composer-inner">
    <textarea id="chatInput" rows="1" data-i18n-placeholder="advisor_placeholder" placeholder="Ask about prices, timing, or an offer..."></textarea>
    <button type="button" class="send-btn" id="sendBtn" aria-label="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </div>
  <p class="hint" data-i18n="advisor_hint">AI-generated — always confirm big decisions with your local mandi before selling.</p>
</div>

<script>
  var chatInner = document.getElementById("chatInner");
  var chatWrap = document.getElementById("chatWrap");
  var chatInput = document.getElementById("chatInput");
  var sendBtn = document.getElementById("sendBtn");
  var suggestions = document.getElementById("suggestions");

  var chatHistory = [
    { role: "assistant", content: window.AgriI18n.t("advisor_greeting") }
  ];

  function scrollToBottom() {
    chatWrap.scrollTop = chatWrap.scrollHeight;
  }

  function addMessage(role, text, isError) {
    var row = document.createElement("div");
    row.className = "msg " + (role === "user" ? "user" : "bot") + (isError ? " error" : "");
    var avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "You" : "AI";
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(avatar);
    row.appendChild(bubble);
    chatInner.appendChild(row);
    scrollToBottom();
    return bubble;
  }

  function addTyping() {
    var row = document.createElement("div");
    row.className = "msg bot";
    row.id = "typingRow";
    row.innerHTML = '<div class="avatar">AI</div><div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
    chatInner.appendChild(row);
    scrollToBottom();
  }
  function removeTyping() {
    var row = document.getElementById("typingRow");
    if (row) row.remove();
  }

  chatHistory.forEach(function (m) { addMessage(m.role, m.content); });

  async function sendMessage(text) {
    text = text.trim();
    if (!text) return;
    suggestions.style.display = "none";
    addMessage("user", text);
    chatHistory.push({ role: "user", content: text });
    chatInput.value = "";
    chatInput.style.height = "auto";
    sendBtn.disabled = true;
    addTyping();

    try {
      var res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: chatHistory })
      });
      var data = await res.json();
      removeTyping();
      if (!res.ok) {
        chatHistory.pop(); // drop the unanswered turn so it doesn't confuse the next message
        addMessage("assistant", data.error || "Something went wrong. Please try again.", true);
        return;
      }
      addMessage("assistant", data.reply);
      chatHistory.push({ role: "assistant", content: data.reply });
    } catch (err) {
      removeTyping();
      chatHistory.pop();
      addMessage("assistant", "Could not reach the AI service: " + err.message, true);
    } finally {
      sendBtn.disabled = false;
      chatInput.focus();
    }
  }

  sendBtn.addEventListener("click", function () { sendMessage(chatInput.value); });
  chatInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(chatInput.value); }
  });
  chatInput.addEventListener("input", function () {
    chatInput.style.height = "auto";
    chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + "px";
  });
  suggestions.querySelectorAll("[data-q]").forEach(function (btn) {
    btn.addEventListener("click", function () { sendMessage(btn.getAttribute("data-q")); });
  });

  document.addEventListener("agri:langchange", function () {
    if (chatHistory.length === 1 && chatHistory[0].role === "assistant") {
      var text = window.AgriI18n.t("advisor_greeting");
      chatHistory[0].content = text;
      var firstBubble = chatInner.querySelector(".msg .bubble");
      if (firstBubble) firstBubble.textContent = text;
    }
  });
</script>
</body>
</html>
